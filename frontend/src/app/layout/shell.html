<ejs-appbar colorMode="Inherit" cssClass="app-bar">
  <button
    ejs-button
    cssClass="e-flat e-round nav-btn"
    iconCss="e-icons e-menu"
    (click)="toggleSidebar()"
    [attr.aria-label]="sidebarOpen() ? 'ย่อเมนู' : 'ขยายเมนู'"
  ></button>

  <a routerLink="/dashboard" class="brand-link">
    <span class="brand-icon">
      <span class="e-icons e-clock"></span>
      <span class="brand-pulse"></span>
    </span>
    <span class="hidden truncate text-base font-semibold sm:inline">SmartAsset Analytics</span>
    <span class="ai-badge">AI</span>
  </a>

  <div class="ml-4 hidden min-w-0 md:block">
    <ejs-breadcrumb
      [items]="breadcrumb()"
      [enableNavigation]="false"
      (itemClick)="onCrumb($event)"
    ></ejs-breadcrumb>
  </div>

  <div class="e-appbar-spacer"></div>

  <button
    type="button"
    class="search-trigger"
    (click)="paletteOpen.set(true)"
    aria-label="ค้นหาและคำสั่ง (Ctrl+K)"
  >
    <span class="search-glow"></span>
    <span class="e-icons e-search"></span>
    <span class="hidden md:inline">ค้นหา...</span>
    <kbd class="hidden md:inline">Ctrl K</kbd>
  </button>

  <app-alert-panel />

  <button
    ejs-button
    cssClass="e-flat e-round nav-btn"
    iconCss="e-icons e-contrast"
    (click)="theme.toggle()"
    [attr.aria-label]="theme.isDark() ? 'เปลี่ยนเป็นธีมสว่าง' : 'เปลี่ยนเป็นธีมมืด'"
    [attr.title]="theme.isDark() ? 'ธีมสว่าง' : 'ธีมมืด'"
  ></button>

  @if (auth.user(); as user) {
    <button
      ejs-dropdownbutton
      cssClass="e-flat user-menu e-caret-hide"
      [items]="userMenu()"
      (select)="onUserMenu($event)"
      aria-label="เมนูผู้ใช้"
    >
      <span class="flex items-center gap-2">
        <span class="avatar-ring">
          <app-avatar
            [name]="auth.user()?.full_name ?? ''"
            [src]="avatar.photo()?.thumb_url"
            [size]="32"
          />
        </span>
        <span class="hidden text-left leading-tight lg:block">
          <span class="block text-sm font-medium text-on-surface">{{ user.full_name }}</span>
          <span class="block text-xs text-on-surface-variant">{{ roleLabel() }}</span>
        </span>
      </span>
    </button>
  }
</ejs-appbar>

<div
  class="body"
  [class.sidebar-docked]="docked()"
  [class.sidebar-expanded]="isDesktop() && sidebarOpen()"
>
  <ejs-sidebar
    class="sidebar"
    [type]="isDesktop() ? 'Push' : 'Over'"
    width="256px"
    dockSize="72px"
    [enableDock]="isDesktop()"
    [showBackdrop]="!isDesktop()"
    [closeOnDocumentClick]="!isDesktop()"
    [enableGestures]="false"
    [animate]="false"
    target=".body"
    [isOpen]="sidebarOpen()"
    (close)="onSidebarClose()"
  >
    <nav class="menu" [class.docked]="docked()" aria-label="เมนูหลัก">
      @for (group of menu(); track group.label) {
        @if (group.items.length) {
          <div class="section">{{ group.label }}</div>
          @for (item of group.items; track item.path) {
            <a
              [routerLink]="item.path"
              routerLinkActive="active"
              [attr.title]="docked() ? item.label : null"
            >
              <span class="nav-icon" [class]="item.icon"></span>
              <span class="label">{{ item.label }}</span>
              <span class="active-indicator"></span>
            </a>
          }
        }
      }
    </nav>
  </ejs-sidebar>

  <main class="content e-main-content" #content>
    <div class="content-mesh"></div>
    <router-outlet />
    <app-back-to-top [target]="content" />
  </main>
</div>

<app-command-palette [(open)]="paletteOpen" [commands]="commands()" />

<ejs-toast
  #toast
  [position]="{ X: 'Right', Y: 'Top' }"
  [timeOut]="3500"
  [showCloseButton]="true"
  [showProgressBar]="true"
  [newestOnTop]="true"
  [animation]="toastAnimation"
></ejs-toast>
