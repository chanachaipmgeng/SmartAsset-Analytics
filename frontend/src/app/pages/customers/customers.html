<div class="page">
  <app-page-header title="ลูกค้า" subtitle="บริษัทลูกค้าของแต่ละกลุ่มลูกค้าและระดับบริการ">
    @if (auth.canWrite()) {
      <button ejs-button [isPrimary]="true" iconCss="e-icons e-plus" (click)="openCreate()">เพิ่มลูกค้า</button>
      <button ejs-button iconCss="e-icons e-edit" [disabled]="!selected()" (click)="openEdit()">แก้ไข</button>
      @if (auth.isAdmin()) {
        @if (selected()?.is_active === false) {
          <button ejs-button iconCss="e-icons e-check" [disabled]="busy()" (click)="toggleActive()">เปิดใช้งาน</button>
        } @else {
          <button ejs-button cssClass="e-danger" iconCss="e-icons e-lock" [disabled]="!selected() || busy()" (click)="toggleActive()">ระงับ</button>
        }
      }
    }
  </app-page-header>

  <app-filter-chips [options]="filters()" [(value)]="activeFilter" label="กรองตามสถานะลูกค้า" />

  <div class="panel">
    <app-data-grid
      [data]="rows()"
      [columns]="columns()"
      perspectiveKey="customers"
      exportName="customers"
      [loading]="customers.isLoading()"
      [error]="customers.error()"
      emptyTitle="ยังไม่มีลูกค้า"
      emptyMessage="เพิ่มลูกค้ารายแรกเพื่อเริ่มบันทึกจุดติดตั้ง"
      (selectionChange)="onRowSelected($event)"
      (rowDoubleClick)="editRow($event)"
      [rowActions]="rowActions()"
      (rowAction)="onRowAction($event)"
      (retry)="customers.reload()"
    >
      <ng-template gridCell="company_name" let-row>
        <a class="customer-link" [routerLink]="['/customers', row.id]" (click)="$event.stopPropagation()">{{ row.company_name }}</a>
      </ng-template>
      <ng-template gridCell="level_label" let-row>
        <span class="level-chip" [attr.data-level]="row.service_level">{{ row.level_label }}</span>
      </ng-template>
      <ng-template gridCell="active_label" let-row>
        <span class="tone-chip" [attr.data-tone]="row.is_active ? 'success' : null">{{ row.active_label }}</span>
      </ng-template>
    </app-data-grid>
  </div>
</div>

<ejs-dialog
  [visible]="formOpen()"
  (close)="formOpen.set(false)"
  [header]="editingId() ? 'แก้ไขลูกค้า' : 'เพิ่มลูกค้า'"
  [isModal]="true"
  [showCloseIcon]="true"
  [animationSettings]="animation"
  width="600px"
  target="body"
>
  <ng-template #content>
    <div class="form-grid">
      <div class="full">
        <label>ชื่อบริษัท *</label>
        <ejs-textbox [(value)]="companyName" [liveValue]="companyName"></ejs-textbox>
      </div>
      @if (auth.isSuperadmin() && !editingId()) {
        <div class="full">
          <label>กลุ่มลูกค้า *</label>
          <ejs-dropdownlist [dataSource]="tenantOptions()" [fields]="{ value: 'value', text: 'text' }" [(value)]="tenantId" placeholder="เลือกกลุ่มลูกค้า"></ejs-dropdownlist>
        </div>
      }
      <div>
        <label>ผู้ติดต่อ</label>
        <ejs-textbox [(value)]="contactPerson" [liveValue]="contactPerson"></ejs-textbox>
      </div>
      <div>
        <label>โทรศัพท์</label>
        <ejs-textbox [(value)]="phone" [liveValue]="phone"></ejs-textbox>
      </div>
      <div>
        <label>อีเมล</label>
        <ejs-textbox type="email" [(value)]="email" [liveValue]="email"></ejs-textbox>
      </div>
      <div>
        <label>ระดับบริการ</label>
        <ejs-dropdownlist [dataSource]="levelOptions" [fields]="{ value: 'value', text: 'text' }" [(value)]="serviceLevel"></ejs-dropdownlist>
      </div>
      <div>
        <label>เลขประจำตัวผู้เสียภาษี</label>
        <ejs-textbox [(value)]="taxId" [liveValue]="taxId" [cssClass]="taxIdInvalid() ? 'e-error' : ''" placeholder="13 หลัก"></ejs-textbox>
        @if (taxIdInvalid()) {
          <p class="m-0 mt-1 text-xs text-error">ต้องเป็นตัวเลข 13 หลัก</p>
        }
      </div>
      <div class="full">
        <label>ที่อยู่</label>
        <ejs-textarea [(value)]="address" [liveValue]="address" rows="2"></ejs-textarea>
      </div>
      <div class="full">
        <label>หมายเหตุ</label>
        <ejs-textarea [(value)]="notes" [liveValue]="notes" rows="2"></ejs-textarea>
      </div>
    </div>
  </ng-template>
  <ng-template #footerTemplate>
    <button ejs-button (click)="formOpen.set(false)">ยกเลิก</button>
    <button ejs-button [isPrimary]="true" [disabled]="!formValid() || busy()" (click)="save()">บันทึก</button>
  </ng-template>
</ejs-dialog>
