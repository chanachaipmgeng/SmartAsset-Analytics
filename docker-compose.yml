name: myassets-office

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory_owner -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    image: myassets-office/api:${APP_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://inventory_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@db:5432/inventory
      MIGRATION_DATABASE_URL: postgresql+asyncpg://inventory_owner:${POSTGRES_PASSWORD}@db:5432/inventory
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-7}
      CORS_ORIGINS: ${PUBLIC_URL:-http://localhost}
      SEED_ON_START: ${SEED_ON_START:-true}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD in .env}
      API_WORKERS: ${API_WORKERS:-2}

  frontend:
    build: ./frontend
    image: myassets-office/frontend:${APP_VERSION:-latest}
    restart: unless-stopped
    environment:
      SYNCFUSION_LICENSE: ${SYNCFUSION_LICENSE:-}

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
